# Copy to collector.local.yaml and merge these named entries into your existing configuration.
# Point include paths at your real files or at the samples/ folder from this article.
sinks:
  existing_files_logscale:
    type: logscale
    url: "https://YOUR-LOGSCALE-HOST.example"
    token: "REPLACE_WITH_COLLECTOR_INGEST_TOKEN"
    queue:
      type: disk
      maxLimitInMB: 256
      fullAction: pause

sources:
  existing_text_logs:
    type: file
    include:
      - '/var/log/demo/app-sample.log'
      # - '/var/log/app/*.log'
    encoding: UTF-8
    sink: existing_files_logscale
    parser: existing-text

  existing_jsonl_logs:
    type: file
    include:
      - '/var/log/demo/events-sample.jsonl'
      # - '/var/log/app/*.jsonl'
    encoding: UTF-8
    sink: existing_files_logscale
    parser: existing-jsonl
