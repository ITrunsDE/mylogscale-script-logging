# Copy to collector.local.yaml and merge these named entries into your existing configuration.
sinks:
  python_logscale:
    type: logscale
    url: "https://YOUR-LOGSCALE-HOST.example"
    token: "REPLACE_WITH_COLLECTOR_INGEST_TOKEN"
    queue:
      type: disk
      maxLimitInMB: 256
      fullAction: pause

sources:
  python_files:
    type: file
    include:
      - '/opt/logscale-demo/logs/example-*.jsonl'
    encoding: UTF-8
    sink: python_logscale
    parser: python-jsonl
